<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soul Break</title>
  <link rel="stylesheet" href="/static/style.css">

  <!-- Static fallback embed metadata. The Cloudflare Worker (worker/og-embed.js)
       serves this template at pretty URLs (/20210006, /m/?ids=…) and rewrites
       these tags per request so unfurls reflect the referenced soul breaks. -->
  <meta property="og:site_name" content="ffrk.xyz">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Soul Break">
  <meta property="og:description" content="Final Fantasy Record Keeper soul break reference.">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <div class="ref-page">
    <header class="ref-header">
      <h1>Soul Break</h1>
      <a class="ref-back" href="/search">Search</a>
    </header>

    <div id="loading" class="loading"><p>Loading…</p></div>
    <div id="empty" class="no-results" style="display:none">
      <p>No soul break referenced.</p>
    </div>
    <div id="missing" class="ref-missing" style="display:none"></div>
    <div id="cards" class="ref-cards"></div>
  </div>

  <script src="/static/sb-ids.js"></script>
  <script>
    const loading = document.getElementById('loading');
    const empty = document.getElementById('empty');
    const missing = document.getElementById('missing');
    const cards = document.getElementById('cards');

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text ?? '';
      return div.innerHTML;
    }

    const ids = parseRef(window.location.pathname, window.location.search);

    if (ids.length === 0) {
      loading.style.display = 'none';
      empty.style.display = 'block';
    } else {
      fetch('/data/all.json')
        .then(r => r.json())
        .then(data => {
          const store = {};
          data.items.forEach(item => { store[item.id] = item; });

          const found = [];
          const notFound = [];
          ids.forEach(id => (store[id] ? found.push(store[id]) : notFound.push(id)));

          loading.style.display = 'none';

          if (found.length === 1) {
            document.title = `${found[0].character} – ${found[0].name} | ffrk.xyz`;
          } else if (found.length > 1) {
            document.title = `${found.length} soul breaks | ffrk.xyz`;
          }

          if (notFound.length) {
            missing.style.display = 'block';
            missing.textContent = `${notFound.length} unknown id${notFound.length === 1 ? '' : 's'}: ${notFound.join(', ')}`;
          }

          if (found.length === 0) {
            empty.style.display = 'block';
            return;
          }

          cards.innerHTML = found.map(item => `
            <div class="ref-card">
              <img class="ref-card-img" src="${escapeHtml(item.image_url)}" alt="${escapeHtml(item.sb_version)}" loading="lazy">
              <div class="ref-card-body">
                <div class="ref-card-title">
                  <strong>${escapeHtml(item.character)}</strong>
                  <span class="ref-card-name">${escapeHtml(item.name)}</span>
                </div>
                <div class="ref-card-meta">
                  <span class="ref-tag">${escapeHtml(item.sb_version)}</span>
                  <span class="ref-tag">${escapeHtml(item.realm)}</span>
                  ${(item.elements || []).map(e => `<span class="ref-tag ref-tag-el">${escapeHtml(e)}</span>`).join('')}
                </div>
                <div class="ref-card-desc">${escapeHtml(item.description)}</div>
              </div>
            </div>
          `).join('');
        })
        .catch(err => {
          loading.textContent = 'Failed to load soul break data.';
          console.error(err);
        });
    }
  </script>
</body>
</html>
