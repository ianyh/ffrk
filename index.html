<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ffrk.xyz · Soul break search</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/search.css">

  <!-- buildShareUrl (the /id and /m/?ids=… share scheme) + accentFor/el (the
       per-type accent, shared with the cards and the detail page). -->
  <script src="/static/sb-ids.js"></script>
  <script src="/card/card.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body>
  <div class="search-page" x-data="search()" x-cloak>
    <div class="search-topbar"><strong>ffrk.xyz</strong></div>

    <p class="search-blurb">
      Search Final Fantasy Record Keeper soul breaks and grab a shareable
      permalink. Select one or more results, then copy the link — a single pick
      becomes <code>ffrk.xyz/&lt;id&gt;</code>, several become one
      <code>/m/?ids=…</code> link.
    </p>

    <input class="search-input" type="text" x-model="query"
           placeholder="Search by character, soul break, or id…" autofocus>

    <!-- Selecting rows builds a share link; one id → /id, several → /m/?ids=… -->
    <div class="share-bar" x-show="selected.size > 0" x-cloak>
      <span class="count" x-text="`${selected.size} selected`"></span>
      <button type="button" @click="copyLink" x-text="copyLabel"></button>
      <a class="preview" :href="previewUrl" target="_blank" rel="noopener">Preview ↗</a>
      <button type="button" class="ghost" @click="clearSelection">Clear</button>
    </div>

    <!-- Persistent selection tray: stays put even when the search is cleared,
         so you can keep building a set across several searches. -->
    <ul class="results selected-list" x-show="selected.size > 0" x-cloak>
      <template x-for="item in selectedItems" :key="item.id">
        <li class="row selected" :style="`--accent:${accentFor(item.type)}`" @click="toggle(item.id)">
          <span class="row-check">✓</span>
          <span class="row-icon"><img :src="item.image_url" alt="" loading="lazy"></span>
          <span class="row-text">
            <span class="row-title">
              <span class="row-character" x-text="item.character"></span>
              <span class="row-version" x-text="item.sb_version"></span>
              <span class="row-name" x-text="item.name"></span>
            </span>
            <span class="row-id" x-text="item.id"></span>
          </span>
          <a class="row-link" :href="'/' + item.id" target="_blank" rel="noopener"
             title="Open permalink" @click.stop>↗</a>
        </li>
      </template>
    </ul>

    <p class="search-meta" x-text="meta"></p>

    <ul class="results">
      <template x-for="item in shown" :key="item.id">
        <li class="row" :class="{ selected: selected.has(item.id) }"
            :style="`--accent:${accentFor(item.type)}`" @click="toggle(item.id)">
          <span class="row-check"><span x-show="selected.has(item.id)">✓</span></span>
          <span class="row-icon"><img :src="item.image_url" alt="" loading="lazy"></span>
          <span class="row-text">
            <span class="row-title">
              <span class="row-character" x-text="item.character"></span>
              <span class="row-version" x-text="item.sb_version"></span>
              <span class="row-name" x-text="item.name"></span>
            </span>
            <span class="row-id" x-text="item.id"></span>
          </span>
          <a class="row-link" :href="'/' + item.id" target="_blank" rel="noopener"
             title="Open permalink" @click.stop>↗</a>
        </li>
      </template>
    </ul>
  </div>

  <script>
    // Derive a global tier ordering empirically. Within a character, id order is
    // the exact release order, so each character's id-sorted sequence is a
    // partial chronology of tiers. Averaging each tier's normalized position
    // (0 = that character's first SB, 1 = its latest) across all characters
    // yields a stable oldest→newest tier ranking that needs no hand-maintained
    // list — new tiers slot themselves in as the data grows. Returns a map of
    // tier → rank (higher = newer).
    // Over-engineered beyond belief, but kinda fun.
    function tierRanks(items) {
      const byChar = {};
      for (const it of items) (byChar[it.character] ||= []).push(it);

      const sums = {};   // tier -> { total, n }
      for (const list of Object.values(byChar)) {
        if (list.length < 2) continue;  // can't position a lone SB on [0,1]
        const sorted = list.slice().sort((a, b) => Number(a.id) - Number(b.id));
        sorted.forEach((it, i) => {
          const pos = i / (sorted.length - 1);
          const s = (sums[it.tier] ||= { total: 0, n: 0 });
          s.total += pos;
          s.n += 1;
        });
      }

      const tiers = Object.keys(sums).sort(
        (a, b) => sums[a].total / sums[a].n - sums[b].total / sums[b].n);
      const rank = {};
      tiers.forEach((t, i) => { rank[t] = i; });   // oldest = 0, newest = highest
      return rank;
    }

    function search() {
      return {
        query: '',
        items: [],
        byId: {},
        shown: [],
        meta: 'Loading…',
        selected: new Set(),
        copyLabel: 'Copy link',
        LIMIT: 100,

        // Selected items, in pick order — the persistent tray at the top.
        get selectedItems() {
          return [...this.selected].map(id => this.byId[id]).filter(Boolean);
        },

        // Shortest shareable URL for the current selection (order preserved).
        // This is the pretty scheme (/id, /m/?ids=…) served by the Cloudflare
        // Worker in production — what we put on the clipboard to share.
        get shareUrl() {
          return buildShareUrl(window.location.origin, [...this.selected]);
        },

        // Preview points straight at view.html?ids=… so it works on the bare
        // static origin too (the pretty URLs above need the Worker in front).
        get previewUrl() {
          const qs = [...this.selected].map(id => `ids=${encodeURIComponent(id)}`).join('&');
          return `/view.html?${qs}`;
        },

        init() {
          this.$watch('query', () => this.filter());
          fetch('/data/all.json')
            .then(r => r.json())
            .then(data => {
              // Sort newest-first. There's no release date in the data, so we
              // order by tier era (tiers roll out game-wide in waves), then by id
              // descending as a tiebreak. Within a character the id is the exact
              // release order, but across characters the id prefix is just an
              // arbitrary character slot — hence the tier proxy. filter() keeps
              // this order.
              const rank = tierRanks(data.items);
              const r = t => rank[t] ?? -1;   // unranked tiers sort oldest
              this.items = data.items.slice().sort((a, b) =>
                (r(b.tier) - r(a.tier)) || (Number(b.id) - Number(a.id)));
              this.items.forEach(it => { this.byId[it.id] = it; });
              this.meta = `Type to search ${this.items.length} soul breaks.`;
            });
        },

        // Live substring match: every space-separated term must appear somewhere
        // in the character / name / version / id text. Capped for rendering.
        filter() {
          const q = this.query.trim().toLowerCase();
          if (!q) {
            this.shown = [];
            this.meta = `Type to search ${this.items.length} soul breaks.`;
            return;
          }
          const terms = q.split(/\s+/);
          const matches = this.items.filter(it => {
            const hay = `${it.character} ${it.name} ${it.name_jp} ${it.sb_version} ${it.id}`.toLowerCase();
            return terms.every(t => hay.includes(t));
          });
          // Selected items live in the tray above; don't repeat them here.
          this.shown = matches.filter(it => !this.selected.has(it.id)).slice(0, this.LIMIT);
          this.meta = matches.length > this.LIMIT
            ? `Showing first ${this.LIMIT} of ${matches.length} matches.`
            : `${matches.length} match${matches.length === 1 ? '' : 'es'}.`;
        },

        // Reassign the Set so Alpine picks up the change reactively, then refresh
        // the results so the item moves between the tray and the result list.
        toggle(id) {
          const next = new Set(this.selected);
          next.has(id) ? next.delete(id) : next.add(id);
          this.selected = next;
          this.copyLabel = 'Copy link';
          this.filter();
        },

        clearSelection() {
          this.selected = new Set();
          this.filter();
        },

        async copyLink() {
          try {
            await navigator.clipboard.writeText(this.shareUrl);
            this.copyLabel = 'Copied!';
            setTimeout(() => { this.copyLabel = 'Copy link'; }, 1500);
          } catch (e) {
            // Clipboard API needs a secure context; fall back to a prompt.
            window.prompt('Copy this link:', this.shareUrl);
          }
        },
      };
    }
  </script>
</body>
</html>
