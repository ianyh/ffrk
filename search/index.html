<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · ffrk.xyz</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/sb-ids.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lunr/lunr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body>
  <div x-data="search()">
    <form @submit.prevent="runQuery">
      <input type="text" x-model="query" placeholder="Search...">
      <select x-model="queryFields.tier">
        <option value="">Tier</option>
        <template x-for="opt in options.tier" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>
      <select x-model="queryFields.character">
        <option value="">Character</option>
        <template x-for="opt in options.characters" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>
      <select x-model="queryFields.realm">
        <option value="">Realm</option>
        <template x-for="opt in options.realms" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>
      <select multiple x-model="filterFields.elements">
        <template x-for="opt in options.elements" :key="opt">
          <option :value="opt" x-text="opt"></option>
        </template>
      </select>
      <button type="submit">Search</button>
    </form>

    <p x-show="results !== null" x-text="`${results?.length ?? 0} results`"></p>

    <div class="share-bar" x-show="selectedCount > 0" x-cloak>
      <span class="share-status" x-text="`${selectedCount} selected`"></span>
      <button type="button" @click="copyShareLink" x-text="copyLabel"></button>
      <a class="share-status" :href="shareUrl" target="_blank" rel="noopener">Preview ↗</a>
      <button type="button" class="share-clear" @click="clearSelection">Clear</button>
    </div>

    <ul>
      <template x-for="item in results ?? []" :key="item.id">
        <li class="result-row">
          <input type="checkbox" :checked="selected.has(item.id)" @change="toggleSelected(item.id)">
          <span>
            <strong x-text="item.character"></strong> —
            <span x-text="item.sb_version"></span>
            <span x-text="item.name"></span>
          </span>
          <a class="share-status" :href="'/' + item.id" target="_blank" rel="noopener" title="Open permalink">↗</a>
        </li>
      </template>
    </ul>
  </div>

  <script>
    function search() {
      return {
        query: '',
        results: null,
        index: null,
        filterFields: { elements: [] },
        queryFields: { tier: '', character: '', realm: '' },
        options: { tier: [], characters: [], realms: [], elements: [] },
        store: {},
        selected: new Set(),
        selectedCount: 0,
        copyLabel: 'Copy share link',

        get shareUrl() {
          return buildShareUrl(window.location.origin, [...this.selected]);
        },

        toggleSelected(id) {
          this.selected.has(id) ? this.selected.delete(id) : this.selected.add(id);
          this.selectedCount = this.selected.size;
          this.copyLabel = 'Copy share link';
        },

        clearSelection() {
          this.selected.clear();
          this.selectedCount = 0;
        },

        async copyShareLink() {
          try {
            await navigator.clipboard.writeText(this.shareUrl);
            this.copyLabel = 'Copied!';
          } catch (e) {
            // Clipboard API needs a secure context; fall back to a prompt.
            window.prompt('Copy this link:', this.shareUrl);
          }
        },

        init() {
            fetch('/data/all.json')
            .then(r => r.json())
            .then(data => {
              const items = data.items;
              this.options.tier = [...new Set(items.map(item => item.tier))].sort();
              this.options.characters = [...new Set(items.map(item => item.character))].sort();
              this.options.realms = [...new Set(items.map(item => item.realm))].sort();
              this.options.elements = [...new Set(items.flatMap(item => item.elements))].sort();
              items.forEach(item => this.store[item.id] = item);
              this.index = lunr(function() {
                this.ref('id');
                this.field('realm');
                this.field('elements');
                this.field('image_url');
                this.field('character');
                this.field('tier');
                this.field('tier_display')
                this.field("sb_version");
                items.forEach(item => this.add(item));
              });
            });
        },

        runQuery() {
          const queries = [];
          for (const [key, value] of Object.entries(this.queryFields)) {
            if (!value.trim()) {
              continue;
            }
            queries.push(`+${key}:${value}`);
          }
          query = queries.join(" ");

          try {
            const hits = this.index.search(query);
            const results = hits.map(hit => this.store[hit.ref]);
            this.results = results.filter(result => {
              let matches = false;
              for (const [key, value] of Object.entries(this.filterFields)) {
                if (value.length == 0) {
                  matches = true;
                } else if (result[key].length == 0) {
                  return false
                } else {
                  matches = value.every(v => result[key].includes(v));
                }
              }
              return matches;
            });
          } catch (e) {
            console.error(e);
            this.results = [];
          }
        }
      }
    }
  </script>
</body>
</html>
