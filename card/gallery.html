<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>card gallery</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/card/card.css">
  <script src="/card/card.js"></script>
  <style>
    /* Stack the stress-test cards with a backdrop, like the old --preview sheet. */
    body { margin: 0; padding: 20px; background: #0a0e16; display: flex; flex-direction: column; gap: 20px; }
  </style>
</head>
<body>
  <!-- Edge-case stress sheet: open under the static server, edit card.css, refresh.
       This replaces the Pillow --preview contact sheet, live in the browser. -->
  <script>
    (async () => {
      const items = await loadItems();
      const byId = Object.fromEntries(items.map(i => [i.id, i]));
      const seen = new Set(), picks = [];
      const add = sb => { if (sb && !seen.has(sb.id)) { seen.add(sb.id); picks.push(sb); } };

      for (const anchor of ['22100026', '20140001', '20140024']) add(byId[anchor]);
      add(items.reduce((a, b) => (b.name.length > a.name.length ? b : a)));         // longest name
      add(items.reduce((a, b) => (b.description.length > a.description.length ? b : a)));  // longest effect
      add(items.find(s => s.elements.length === 0));                                // no elements

      for (const sb of picks) document.body.append(buildCard(sb).card);
    })();
  </script>
</body>
</html>
