<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>card</title>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/card/card.css">
  <script src="/card/card.js"></script>
</head>
<body>
  <!-- One card, driven by ?id=. Open under the static server to preview, or let
       scripts/render_card.py screenshot it headlessly. -->
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get('id') || '22100026';
      const sb = (await loadItems()).find(x => x.id === id);
      if (!sb) { document.title = `id ${id} not found`; return; }

      const { card, img } = buildCard(sb);
      document.body.append(card);
      document.title = `${sb.character} - ${sb.name}`;

      await img.decode().catch(() => {});   // wait for the icon before screenshotting
      document.body.classList.add('ready');  // signal for the headless renderer
    })();
  </script>
</body>
</html>
